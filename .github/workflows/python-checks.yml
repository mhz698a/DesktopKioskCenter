name: Python checks

on:
  pull_request:
  push:
    branches:
      - main
      - feature/user-management-tabs

permissions:
  contents: read

jobs:
  sqlite-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API test dependency
        run: python -m pip install "Flask>=3.1,<4"
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Run SQLite tests
        run: python -m unittest discover -s tests -v

  windows-package:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow
      - name: Build onedir package
        run: python -m PyInstaller --noconfirm --clean main.spec
      - name: Verify executable and bundled resources
        shell: pwsh
        run: |
          $required = @(
            "dist/DesktopKioskCenter/DesktopKioskCenter.exe",
            "dist/DesktopKioskCenter/_internal/icon.png",
            "dist/DesktopKioskCenter/_internal/css/qmainwin.css"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Missing package output: $path"
            }
          }
          # kiosks.json is runtime data and is created under %APPDATA%.
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Compile Windows installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found: $iscc"
          }
          & $iscc "installer.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE"
          }
          $installer = "Output/Installer_DesktopKioskCenter.exe"
          if (-not (Test-Path $installer)) {
            throw "Installer output not found: $installer"
          }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DesktopKioskCenter-Installer
          path: Output/Installer_DesktopKioskCenter.exe
          if-no-files-found: error
          retention-days: 14
